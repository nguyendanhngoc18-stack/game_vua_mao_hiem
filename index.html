<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Supper Tramper</title>
    <link rel="stylesheet" href="./css/game.css">
    <script defer src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
    <script defer src="./js/game.js"></script>
  </head>
  <body>
    <main class="page">
      <h1>Supper Tramper</h1>
      <section class="game" aria-label="Game player">
        <div id="player" class="player">
          <p id="status" role="status" aria-live="polite">
            Đang kiểm tra các tệp game...
          </p>
        </div>
      </section>
      <p class="hint">
        Cần chạy trang qua một máy chủ HTTP tĩnh và có kết nối mạng để tải
        Ruffle từ CDN; trình duyệt thường chặn WebAssembly khi mở trực tiếp
        bằng giao thức file.
      </p>
    </main>
  </body>
</html>
